<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyCare – Auth Action</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;margin:0;padding:32px}
    .card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:24px}
    h1{font-size:20px;margin:0 0 12px}
    p{margin:8px 0 14px;color:#333}
    .muted{color:#667085;font-size:14px}
    .hidden{display:none}
    .center{text-align:center}
    .spinner{display:inline-block;width:18px;height:18px;border:3px solid #e5e7eb;border-top-color:#0f766e;border-radius:50%;animation:spin .9s linear infinite;vertical-align:-3px;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    a.btn{display:inline-block;margin-top:10px;padding:10px 14px;background:#0f766e;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
    .note{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-top:10px}
    pre.debug{white-space:pre-wrap;font-size:12px;color:#666;background:#f9fafb;border:1px solid #eee;border-radius:8px;padding:8px;margin:12px auto;max-width:520px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card" id="view-loading">
    <h1>Processing…</h1>
    <p class="muted"><span class="spinner"></span>Validating your link. Please wait.</p>
  </div>

  <div class="card hidden" id="view-verified">
    <h1>Link verified ✅</h1>
    <p class="muted">You can safely return to the app.</p>
    <div class="center">
      <a class="btn" id="btn-deeplink" href="#">Open EasyCare</a>
      <div class="note muted">If it doesn’t open, copy this URL: <code id="deeplink-code"></code></div>
    </div>
  </div>

  <div class="card hidden" id="view-error">
    <h1 style="color:#b42318">Something went wrong</h1>
    <p id="err-text">Invalid or expired link.</p>
  </div>

<script>
(function(){
  // ---- Supabase ----
  const SUPABASE_URL = "https://tcobgzhtmuxzjdkmwdsy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjb2Jnemh0bXV4empka213ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3OTI2NjYsImV4cCI6MjA2NDM2ODY2Nn0.OmLd2uGnPenJeZO323XRXJK-d-8RPfl-GBEK8MoY1i0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- App deep link ----
  const deeplinkBase = "easycare://auth-success";
  const webFallback  = "https://easycarehh.com";
  const resetPage    = "https://moronevada.github.io/reset-password.html";

  // ---- Helpers UI/Debug ----
  const $ = (id)=>document.getElementById(id);
  const show = (id)=>["view-loading","view-verified","view-error"].forEach(x=>$(x).classList.toggle("hidden", x!==id));
  const dbg = document.createElement('pre'); dbg.className='debug'; document.body.appendChild(dbg);
  const log = (...a)=>{ try{console.log(...a);}catch(_){} dbg.textContent += a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')+'\n'; };

  function setDeeplink(type){
    const params = new URLSearchParams({ type });
    const deep = `${deeplinkBase}?${params.toString()}`;
    const androidPackage = 'easycare.com.easycare_app';
    const intentUrl = `intent://auth-success?${params.toString()}#Intent;scheme=easycare;package=${androidPackage};end`;
    const isAndroid = /Android/i.test(navigator.userAgent);
    const btn = $('btn-deeplink');
    const code = $('deeplink-code');
    if (btn) btn.href = isAndroid ? intentUrl : deep;
    if (code) code.textContent = deep;
    if (btn) btn.addEventListener('click', ()=>{ try{window.location.href = isAndroid ? intentUrl : deep;}catch(_){}} , { once:true });
    setTimeout(()=>{
      if (isAndroid) {
        window.location.replace(intentUrl);
        setTimeout(()=>{ window.location.href = webFallback; }, 1500);
      } else {
        window.location.href = deep;
        setTimeout(()=>{ window.location.href = webFallback; }, 1500);
      }
    }, 300);
  }

  function combinedParams(){
    const q = window.location.search.slice(1);
    const h = window.location.hash.replace(/^#/,'');
    const params = new URLSearchParams(q);
    if (h) {
      const hp = new URLSearchParams(h);
      for (const [k,v] of hp.entries()) if (!params.has(k)) params.set(k,v);
    }
    return params;
  }

  // ---- Read params ----
  const params = combinedParams();
  const type   = (params.get("type") || "").toLowerCase();

  const tokenHash = params.get("token_hash") || params.get("token") || "";
  const code      = params.get("code") || "";
  const codeVer   = params.get("code_verifier") || "";
  const email     = params.get("email") || "";

  const hash = new URLSearchParams(window.location.hash.replace(/^#/,''));
  const accessToken  = hash.get('access_token') || params.get('access_token');
  const refreshToken = hash.get('refresh_token') || params.get('refresh_token');
  const fragType     = (hash.get('type') || '').toLowerCase();

  const err     = (params.get("error") || "").toLowerCase();
  const errCode = (params.get("error_code") || "").toLowerCase();

  // ---- Debug line ----
  log('href:', window.location.href);
  log('type:', type, 'fragType:', fragType);
  log('token_hash present:', !!tokenHash, 'code present:', !!code, 'code_verifier present:', !!codeVer);
  log('email present:', !!email, 'has access_token:', !!accessToken);

  // ---- Errors from provider ----
  if (err || errCode) {
    const msg =
      errCode === "otp_expired" ? "This link has expired. Please request a new one." :
      errCode === "rate_limit" || err === "too_many_requests" ? "Too many attempts. Please try again shortly." :
      err ? `Error: ${err}` : "Something went wrong. Please request a new link.";
    $('err-text').textContent = msg;
    show("view-error");
    return;
  }

  // Send recovery links to the dedicated page
  if (type === 'recovery' || fragType === 'recovery') {
    const next = resetPage + window.location.search + window.location.hash;
    log('redirect -> reset-password.html', next);
    window.location.replace(next);
    return;
  }

  if (!type && !tokenHash && !accessToken) {
    $('err-text').textContent = "Open this page from a valid email link.";
    show("view-error");
    return;
  }

  // ---- Main flow ----
  (async () => {
    try {
      // MAGIC LINK
      if (type === 'magiclink' || (accessToken && fragType !== 'recovery')) {
        if (accessToken && refreshToken) {
          const { error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
          if (error) log('setSession(magiclink) WARN:', error.message || error);
        }
        show("view-verified");
        setDeeplink("magiclink");
        return;
      }

      // SIGNUP / INVITE / EMAIL CHANGE
      if (type === "signup" || type === "email_verification" || type === "invite" || type === "email_change") {
        let ok = false, lastErr = null;

        // a) verifyOtp con token_hash (prioritario)
        if (tokenHash && !ok) {
          try {
            const { error } = await supabase.auth.verifyOtp({
              type: (type === "email_change") ? "email_change" : "signup",
              token_hash: tokenHash
            });
            if (error) throw error;
            ok = true; log("verifyOtp(token_hash) OK");
          } catch (e) { lastErr = e; log("verifyOtp(token_hash) FAIL:", e?.message || e); }
        }

        // b) code SIN code_verifier → verifyOtp(token) REQUIERE email
        if (code && !ok && !codeVer) {
          try {
            const payload = {
              type: (type === "email_change") ? "email_change" : "signup",
              token: code
            };
            if (email) payload.email = email;   // importante
            const { error } = await supabase.auth.verifyOtp(payload);
            if (error) throw error;
            ok = true; log("verifyOtp(code as token) OK (with email)");
          } catch (e) { lastErr = e; log("verifyOtp(code as token) FAIL:", e?.message || e); }
        }

        // c) PKCE real (si llega code + code_verifier)
        if (code && codeVer && !ok) {
          try {
            const { error } = await supabase.auth.exchangeCodeForSession(code);
            if (error) throw error;
            ok = true; log("exchangeCodeForSession OK");
          } catch (e) { lastErr = e; log("exchangeCodeForSession FAIL:", e?.message || e); }
        }

        if (!ok) throw lastErr || new Error("Link could not be verified.");

        show("view-verified");
        setDeeplink(type === "invite" ? "invite" : "verify");
        return;
      }

      // Fallback genérico: si algún día llega PKCE completo fuera de los tipos
      if (code && codeVer) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (!error) { show("view-verified"); setDeeplink("verify"); return; }
      }

      throw new Error('Unknown or unsupported link.');
    } catch (e) {
      log('FINAL ERROR:', e?.message || e);
      $('err-text').textContent = e?.message || "Invalid or expired link.";
      show("view-error");
    }
  })();
})();
</script>
</body>
</html>
