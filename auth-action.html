<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Authentication Action</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; }
    h1 { font-size: 28px; color: #0A355A; margin: 0 0 8px; }
    p { color: #333; margin: 0 0 12px; }
    .hidden { display: none; }
    .actions a {
      display: inline-block; margin: 8px 8px 0 0; padding: 10px 16px; border-radius: 8px;
      text-decoration: none; background: #0A355A; color: #fff; font-weight: 600;
    }
    .actions a.secondary { background: #e5e7eb; color: #111; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0f13; color: #d7dbe0; }
      p { color: #b6bec8; }
      .actions a.secondary { background: #1f2937; color: #e5e7eb; }
    }
  </style>
</head>
<body>
  <h1 id="title">Processing…</h1>
  <p id="desc">Please wait while we complete authentication.</p>

  <div id="fallback" class="actions hidden">
    <a id="open-app" href="#">Open the app</a>
    <a class="secondary" href="https://moronevada.github.io/">Go to EasyCare site</a>
  </div>

  <script>
    (function () {
      // Une parámetros de ?query y #hash (Supabase a veces manda datos en el hash)
      function mergeParams() {
        const p = new URLSearchParams(window.location.search);
        const hash = window.location.hash ? window.location.hash.replace(/^#/, "") : "";
        if (hash) {
          const h = new URLSearchParams(hash);
          for (const [k, v] of h.entries()) if (!p.has(k)) p.set(k, v);
        }
        return p;
      }

      const params = mergeParams();
      const typeRaw = params.get("type") || params.get("event") || "";
      const type = typeRaw.toLowerCase();

      // Valores que pueden venir según el flujo
      let code  = params.get("code") || params.get("authorization_code") || params.get("auth_code");
      let token = params.get("token") || params.get("token_hash") || params.get("otp") || params.get("access_token");
      const email = params.get("email") || params.get("email_address") || params.get("user_email");

      function go(url) {
        try { window.location.replace(url); } catch (_) { window.location.href = url; }
        // Fallback visible si el navegador no abre la app
        setTimeout(function () {
          document.getElementById("fallback").classList.remove("hidden");
          document.getElementById("open-app").setAttribute("href", url);
          document.getElementById("title").textContent = "Almost there";
          document.getElementById("desc").textContent = "Tap the button below to open the app.";
        }, 1200);
      }

      // 🛡️ Normalización defensiva:
      // Recovery debe ir por OTP (token). Si llega por error con 'code', lo tratamos como 'token'.
      if (type === "recovery" && !token && code) {
        token = code;
        code = null;
      }

      // 1) MAGIC LINK / RECOVERY / OTP → easycare://auth-success?type=...&token=...&email=...
      if (token && type) {
        const q = new URLSearchParams({ type, token });
        if (email) q.set("email", email);
        go("easycare://auth-success?" + q.toString());
        return;
      }

      // 2) OAuth PKCE (Google, etc.) → io.supabase.easycare://login-callback?code=...
      // (Solo si NO hay 'type', para no confundir recovery con PKCE)
      if (code && !type) {
        go("io.supabase.easycare://login-callback?code=" + encodeURIComponent(code));
        return;
      }

      // 3) Confirmación de email sin credenciales (signup / email_change)
      if (type === "signup" || type === "email_change") {
        go("easycare://auth-success?verified=1&type=" + encodeURIComponent(type));
        return;
      }

      // 4) Fallback (nada reconocible)
      document.getElementById("fallback").classList.remove("hidden");
      document.getElementById("title").textContent = "Done";
      document.getElementById("desc").textContent = "You can close this page.";
    })();
  </script>
</body>
</html>
