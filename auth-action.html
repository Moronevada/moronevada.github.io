<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth Action</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; }
    .hidden { display: none; }
    .actions a { display:inline-block; margin:8px 8px 0 0; padding:10px 16px; border-radius:8px; text-decoration:none; background:#0A355A; color:#fff; font-weight:600; }
    .actions a.secondary { background:#e5e7eb; color:#111; }
    @media (prefers-color-scheme: dark) { .actions a.secondary { background:#1f2937; color:#e5e7eb; } }
  </style>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // ✅ Tus credenciales reales (las mismas que en reset-password.html)
    const SUPABASE_URL = 'https://tcobgzhtmuxzjdkmwdsy.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjb2Jnemh0bXV4empka213ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3OTI2NjYsImV4cCI6MjA2NDM2ODY2Nn0.OmLd2uGnPenJeZO323XRXJK-d-8RPfl-GBEK8MoY1i0'; // tu anon key completa

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'pkce' } });

    function mergeParams(){
      const p = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      for (const [k,v] of h.entries()) if (!p.has(k)) p.set(k,v);
      return p;
    }

    const p = mergeParams();
    const type = (p.get('type')||p.get('event')||'').toLowerCase();
    const code = p.get('code') || p.get('authorization_code') || p.get('auth_code');

    async function go(url){
      try { location.replace(url); } catch { location.href = url; }
      setTimeout(() => {
        document.getElementById('fallback').classList.remove('hidden');
        document.getElementById('open-app').href = url;
      }, 1200);
    }

    (async () => {
      try {
        // Si hay code ⇒ intercambiamos por sesión
        if (code) {
          const { data, error } = await supabase.auth.exchangeCodeForSession(code);
          if (error || !data?.session) throw error || new Error('No session');
        }
        // Enrutamos por tipo
        switch (type) {
          case 'magiclink':  return go('easycare://auth-success?type=magic_done');
          case 'signup':     return go('easycare://auth-success?type=verified');
          case 'recovery':   return location.replace('reset-password.html' + (code?`?code=${encodeURIComponent(code)}`:''));
          default:           return go('easycare://auth-success?type=verified');
        }
      } catch (e) {
        console.error(e);
        document.getElementById('title').textContent = 'Link inválido o expirado';
        document.getElementById('desc').textContent = 'Solicita un nuevo enlace desde la app.';
        document.getElementById('fallback').classList.remove('hidden');
      }
    })();
  </script>
</head>
<body>
  <h1 id="title">Procesando…</h1>
  <p id="desc">Por favor espera un momento.</p>
  <div id="fallback" class="actions hidden">
    <a id="open-app" href="#">Open the app</a>
    <a class="secondary" href="https://moronevada.github.io/">Go to EasyCare site</a>
  </div>
</body>
</html>
