<!doctype html>
<meta charset="utf-8">
<title>Auth redirect</title>
<script>
  (function () {
    const q = new URLSearchParams(location.search);
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));

    // Mezcla query y hash (Supabase a veces usa hash)
    const p = new URLSearchParams();
    for (const [k,v] of q) p.set(k,v);
    for (const [k,v] of h) if (!p.has(k)) p.set(k,v);

    // Si viene 'type' desde nuestra app (magiclink/recovery)
    const type = (p.get('type') || '').toLowerCase();

    // Conserva code/token/token_hash/email, etc.
    const pass = new URLSearchParams();
    ['type','code','token','token_hash','email','provider','next'].forEach(k => {
      const v = p.get(k);
      if (v) pass.set(k, v);
    });

    // Si solo es verificación de email (signup/email_change), marca verified=1
    if (!pass.get('code') && !pass.get('token') && !pass.get('token_hash') && (type === 'signup' || type === 'email_change')) {
      pass.set('verified', '1');
    }

    // Abre la app
    location.href = 'easycare://auth-success?' + pass.toString();
  })();
</script>
<body>Redirecting…</body>
