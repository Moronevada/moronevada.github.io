<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyCare – Reset Bridge</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; padding:24px; background:#f7f9fb; }
    main { max-width:600px; margin:48px auto; text-align:center; background:#fff; padding:28px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h2 { margin:0 0 8px; color:#0A355A; }
    p { color:#445; }
    .hidden { display:none; }
    a.btn { display:inline-block; padding:12px 20px; background:#0B8B86; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; }
  </style>

  <script>
    // Une parámetros de ?query y #hash (algunos clientes meten el token en hash)
    function mergeParams() {
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      for (const [k,v] of h.entries()) if (!q.has(k)) q.set(k,v);
      return q;
    }

    function go(url){
      try { location.replace(url); } catch { location.href = url; }
      setTimeout(() => {
        document.getElementById('fallback')?.classList.remove('hidden');
        const a = document.getElementById('open-app'); if (a) a.href = url;
      }, 1200);
    }

    (function () {
      const p = mergeParams();

      // Supabase de recovery suele mandar ?token=... o ?token_hash=...
      const token =
        p.get('token') ||
        p.get('token_hash') ||
        p.get('access_token') || ''; // por si algún cliente lo transforma

      const email = p.get('email') || '';

      if (!token) {
        document.getElementById('title').textContent = 'Invalid link';
        document.getElementById('desc').textContent  = 'The recovery token is missing or expired. Request a new link from the app.';
        document.getElementById('fallback')?.classList.remove('hidden');
        return;
      }

      // Redirige a la app con el formato que tu Flutter ya maneja
      const qp = new URLSearchParams();
      qp.set('type', 'recovery');
      qp.set('token', token);
      if (email) qp.set('email', email);

      const deepLink = 'easycare://auth-success?' + qp.toString();
      go(deepLink);
    })();
  </script>
</head>
<body>
  <main>
    <h2 id="title">Processing reset…</h2>
    <p id="desc">We are redirecting you to the EasyCare app to finish setting a new password.</p>

    <div id="fallback" class="hidden" style="margin-top:20px;">
      <p>If your app didn’t open automatically, tap:</p>
      <a id="open-app" href="#" class="btn">Open in EasyCare</a>
    </div>
  </main>
</body>
</html>
