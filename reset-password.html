<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Authentication Action</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; padding: 24px; }
    #form-section { margin-top: 16px; }
    input[type="password"] { padding: 10px; width: 260px; max-width: 90%; }
    button { padding: 10px 14px; margin-left: 8px; }
    #message { margin-top: 12px; }
    .muted { color: #666; font-size: 0.95rem; }
    .ok { color: #0a7a3f; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1 id="title">Processing…</h1>

  <div id="form-section" style="display:none;">
    <label for="new-password" class="muted">Create a new password (min 8 chars):</label><br/>
    <input type="password" id="new-password" placeholder="Enter new password" minlength="8" />
    <button id="reset-button">Reset Password</button>
    <div id="password-help" class="muted">Use at least 8 characters. Preferably add numbers and symbols.</div>
  </div>

  <div id="message" class="muted"></div>

  <script>
    // --- CONFIG ---
    const SUPABASE_URL = 'https://tcobgzhtmuxzjdkmwdsy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjb2Jnemh0bXV4empka213ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3OTI2NjYsImV4cCI6MjA2NDM2ODY2Nn0.OmLd2uGnPenJeZO323XRXJK-d-8RPfl-GBEK8MoY1i0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- ELEMENTS ---
    const titleEl = document.getElementById('title');
    const formSection = document.getElementById('form-section');
    const messageEl = document.getElementById('message');
    const resetBtn = document.getElementById('reset-button');

    // Helpers
    const qs = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));

    function setMsg(text, isError = false) {
      messageEl.textContent = text;
      messageEl.className = isError ? 'err' : 'ok';
    }

    function setInfo(text) {
      messageEl.textContent = text;
      messageEl.className = 'muted';
    }

    function disable(el, v) {
      if (!el) return;
      el.disabled = !!v;
    }

    // Basic client-side password check
    function validatePassword(pw) {
      return typeof pw === 'string' && pw.length >= 8;
    }

    async function handleTokenHashFlow(token_hash, type) {
      // New style links (querystring with token_hash)
      // For: 'recovery' | 'signup' | 'magiclink' | 'email_change'
      if (!token_hash || !type) {
        titleEl.innerText = 'Invalid Link';
        setMsg('Missing token or type.', true);
        return;
      }

      try {
        // This will also create a session for magiclink/recovery
        const { data, error } = await supabase.auth.verifyOtp({ token_hash, type });

        if (error) {
          titleEl.innerText = 'Link Error';
          setMsg(error.message || 'Verification failed.', true);
          return;
        }

        // Type-specific handling
        if (type === 'recovery') {
          titleEl.innerText = 'Reset Your Password';
          setInfo('Enter a new password below.');
          formSection.style.display = 'block';

          resetBtn.onclick = async () => {
            const newPassword = document.getElementById('new-password').value;
            if (!validatePassword(newPassword)) {
              setMsg('Please use at least 8 characters for your new password.', true);
              return;
            }
            disable(resetBtn, true);
            setInfo('Updating your password…');

            const { data: upd, error: updErr } = await supabase.auth.updateUser({ password: newPassword });
            if (updErr) {
              setMsg('Error updating password: ' + updErr.message, true);
              disable(resetBtn, false);
            } else {
              formSection.style.display = 'none';
              titleEl.innerText = 'Password updated!';
              setMsg('Your password has been changed. You can now log in.');
            }
          };

        } else if (type === 'signup') {
          titleEl.innerText = 'Email Verified';
          setMsg('Your email is confirmed. You can now log in.');

        } else if (type === 'magiclink') {
          titleEl.innerText = 'Logged in';
          setMsg('Login successful! You can close this tab or go back to the app.');
          // Optional: redirect after a short delay
          // setTimeout(() => window.location.replace('/'), 1200);

        } else if (type === 'email_change') {
          titleEl.innerText = 'Email Updated';
          setMsg('Your email address has been updated.');

        } else {
          titleEl.innerText = 'Unknown Action';
          setMsg('Unsupported action type: ' + type, true);
        }
      } catch (e) {
        titleEl.innerText = 'Unexpected Error';
        setMsg(e.message || 'Something went wrong.', true);
      }
    }

    async function handleHashTokensFlow() {
      // Old style (hash) tokens: #access_token=&refresh_token=&type=
      const access_token = hash.get('access_token');
      const refresh_token = hash.get('refresh_token');
      const type = hash.get('type');

      if (!access_token || !refresh_token || !type) {
        // No usable hash tokens found
        return false;
      }

      try {
        // Store session from tokens (JS v2 soporta strings aquí)
        const { data, error } = await supabase.auth.setSession({ access_token, refresh_token });
        if (error) {
          titleEl.innerText = 'Link Error';
          setMsg(error.message || 'Could not set session from link.', true);
          return true;
        }

        if (type === 'recovery') {
          // Show reset form after session is set
          titleEl.innerText = 'Reset Your Password';
          setInfo('Enter a new password below.');
          formSection.style.display = 'block';

          resetBtn.onclick = async () => {
            const newPassword = document.getElementById('new-password').value;
            if (!validatePassword(newPassword)) {
              setMsg('Please use at least 8 characters for your new password.', true);
              return;
            }
            disable(resetBtn, true);
            setInfo('Updating your password…');

            const { data: upd, error: updErr } = await supabase.auth.updateUser({ password: newPassword });
            if (updErr) {
              setMsg('Error updating password: ' + updErr.message, true);
              disable(resetBtn, false);
            } else {
              formSection.style.display = 'none';
              titleEl.innerText = 'Password updated!';
              setMsg('Your password has been changed. You can now log in.');
            }
          };

        } else if (type === 'magiclink') {
          titleEl.innerText = 'Logged in';
          setMsg('Login successful! You can close this tab or go back to the app.');
        } else if (type === 'signup') {
          titleEl.innerText = 'Email Verified';
          setMsg('Your email is confirmed. You can now log in.');
        } else {
          titleEl.innerText = 'Action Completed';
          setInfo('You may close this tab.');
        }

        // Clean hash to avoid reprocessing on refresh
        history.replaceState({}, document.title, window.location.pathname + window.location.search);
        return true;
      } catch (e) {
        titleEl.innerText = 'Unexpected Error';
        setMsg(e.message || 'Something went wrong.', true);
        return true;
      }
    }

    async function process() {
      // 1) First, check for explicit errors sent by Supabase
      const errDesc = qs.get('error_description') || hash.get('error_description');
      if (errDesc) {
        titleEl.innerText = 'Link Error';
        setMsg(errDesc, true);
        return;
      }

      // 2) New flow: token_hash + type in query
      const token_hash = qs.get('token_hash');
      const typeQS = qs.get('type');

      if (token_hash && typeQS) {
        return handleTokenHashFlow(token_hash, typeQS);
      }

      // 3) Legacy flow: tokens in hash
      const handled = await handleHashTokensFlow();
      if (handled) return;

      // 4) Fallback: show invalid if nothing matched
      titleEl.innerText = 'Invalid or Expired Link';
      setMsg('We could not find a valid authentication action in this URL.', true);
    }

    process();
  </script>
</body>
</html>
