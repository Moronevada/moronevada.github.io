   <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; margin:0; padding:24px; }
    .hidden { display:none; }
    .actions a { display:inline-block; margin-top:12px; padding:10px 16px; border-radius:8px; text-decoration:none; background:#0A355A; color:#fff; font-weight:600; }
  </style>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://tcobgzhtmuxzjdkmwdsy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjb2Jnemh0bXV4empka213ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3OTI2NjYsImV4cCI6MjA2NDM2ODY2Nn0.OmLd2uGnPenJeZO323XRXJK-d-8RPfl-GBEK8MoY1i0';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'pkce' } });

    function mergeParams() {
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      for (const [k,v] of h.entries()) if (!q.has(k)) q.set(k,v);
      return q;
    }

    function go(url){
      try { location.replace(url); } catch { location.href = url; }
      setTimeout(() => {
        document.getElementById('fallback')?.classList.remove('hidden');
        const a = document.getElementById('open-app'); if (a) a.href = url;
      }, 1200);
    }

    (async () => {
      const p = mergeParams();
      const code = p.get('code') || p.get('authorization_code') || p.get('auth_code');
      const accessToken = p.get('access_token');
      const refreshToken = p.get('refresh_token');

      try {
        let at = accessToken, rt = refreshToken;

        if (code) {
          const { data, error } = await supabase.auth.exchangeCodeForSession(code);
          if (error || !data?.session) throw error || new Error('No session (code)');
          at = data.session.access_token;
          rt = data.session.refresh_token;
        } else if (accessToken && refreshToken) {
          const { data, error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
          if (error || !data?.session) throw error || new Error('No session (hash)');
        } else {
          document.getElementById('title').textContent = 'Reset your password';
          document.getElementById('desc').textContent = 'Enlace incompleto. Vuelve a pedir el email de recuperación.';
          return;
        }

        // Deep link a la app con los tokens en el hash para que Flutter los consuma
        const hash = `#access_token=${encodeURIComponent(at)}&refresh_token=${encodeURIComponent(rt)}`;
        go(`easycare://auth-success?type=recovery${hash}`);
      } catch (e) {
        console.error(e);
        document.getElementById('title').textContent = 'Reset your password';
        document.getElementById('desc').textContent = 'Tu enlace expiró o no es válido. Pide uno nuevo desde la app.';
        document.getElementById('fallback')?.classList.remove('hidden');
      }
    })();
  </script>
</head>
<body>
  <h1 id="title">Procesando…</h1>
  <p id="desc">Por favor espera un momento.</p>
  <div id="fallback" class="actions hidden">
    <a id="open-app" href="#">Open the app</a>
  </div>
</body>
</html>
