<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyCare – Reset Password</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;margin:0;padding:32px}
    .card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:24px}
    h1{font-size:20px;margin:0 0 12px}
    p{margin:8px 0 14px;color:#333}
    .muted{color:#667085;font-size:14px}
    .hidden{display:none}
    label{display:block;margin:12px 0 6px}
    input{width:100%;padding:12px 14px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}
    button{margin-top:18px;width:100%;padding:12px;background:#0f766e;color:#fff;border:none;border-radius:10px;font-weight:600;font-size:16px}
    pre.debug{white-space:pre-wrap;font-size:12px;color:#666;background:#f9fafb;border:1px solid #eee;border-radius:8px;padding:8px;margin:12px auto;max-width:520px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card" id="view-loading">
    <h1>Reset your password</h1>
    <p class="muted">Enter a new password below.</p>
    <form id="reset-form">
      <label for="new-pass">New password</label>
      <input id="new-pass" type="password" required />
      <button type="submit">Save new password</button>
    </form>
    <p id="msg" class="muted"></p>
  </div>

  <div class="card hidden" id="view-done">
    <h1>Password updated ✅</h1>
    <p class="muted">You can now return to the app and log in with your new password.</p>
  </div>

<script>
(function(){
  const SUPABASE_URL = "https://tcobgzhtmuxzjdkmwdsy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjb2Jnemh0bXV4empka213ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3OTI2NjYsImV4cCI6MjA2NDM2ODY2Nn0.OmLd2uGnPenJeZO323XRXJK-d-8RPfl-GBEK8MoY1i0";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id)=>document.getElementById(id);
  const dbg = document.createElement('pre'); dbg.className='debug'; document.body.appendChild(dbg);
  const log = (...a)=>{console.log(...a); dbg.textContent += a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')+'\n'; };

  function combinedParams(){
    const q = window.location.search.slice(1);
    const h = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(q);
    if (h) { const hp = new URLSearchParams(h); for (const [k,v] of hp.entries()) if (!params.has(k)) params.set(k,v); }
    return params;
  }

  const params = combinedParams();
  const type   = (params.get("type") || "").toLowerCase();
  const tokenHash = params.get("token_hash") || "";
  const code      = params.get("code") || "";
  const email     = params.get("email") || "";
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const accessToken  = hash.get('access_token') || params.get('access_token');
  const refreshToken = hash.get('refresh_token') || params.get('refresh_token');

  log('href:', window.location.href);
  log('type:', type);
  log('token_hash present:', !!tokenHash, 'code present:', !!code);

  if (tokenHash) log("Detectado flujo: token_hash clásico");
  if (code && code.startsWith("pkce_")) log("Detectado flujo: PKCE exchange");
  if (code && !code.startsWith("pkce_") && code) log("Detectado flujo: code simple fallback");

  // ---- Intentar setSession en base al link recibido ----
  (async () => {
    try {
      let ok = false, lastErr = null;

      if (accessToken && refreshToken && !ok) {
        const { error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        if (error) { lastErr = error; log("setSession FAIL:", error.message); }
        else { ok = true; log("setSession OK"); }
      }

      if (tokenHash && !ok) {
        try {
          const { error } = await supabase.auth.verifyOtp({ type: "recovery", token_hash: tokenHash });
          if (error) throw error; ok = true; log("verifyOtp(token_hash) OK");
        } catch (e) { lastErr = e; log("verifyOtp(token_hash) FAIL:", e.message); }
      }

      if (code && code.startsWith("pkce_") && !ok) {
        try {
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error; ok = true; log("exchangeCodeForSession OK");
        } catch (e) { lastErr = e; log("exchangeCodeForSession FAIL:", e.message); }
      }

      if (code && !ok) {
        try {
          const payload = { type: "recovery", token: code };
          if (email) payload.email = email;
          const { error } = await supabase.auth.verifyOtp(payload);
          if (error) throw error; ok = true; log("verifyOtp(code as token) OK");
        } catch (e) { lastErr = e; log("verifyOtp(code as token) FAIL:", e.message); }
      }

      if (!ok) throw lastErr || new Error("Link could not be verified.");

      // ---- Form submit ----
      $('reset-form').addEventListener('submit', async (ev)=>{
        ev.preventDefault();
        const newPass = $('new-pass').value.trim();
        $('msg').textContent = "Updating password…";
        const { error } = await supabase.auth.updateUser({ password: newPass });
        if (error) {
          $('msg').textContent = "Error: " + error.message;
          log("updateUser FAIL:", error.message);
        } else {
          $('view-loading').classList.add('hidden');
          $('view-done').classList.remove('hidden');
          log("Password updated OK");
        }
      });

    } catch (e) {
      $('msg').textContent = e.message || "Invalid or expired link.";
      log("FINAL ERROR:", e.message);
    }
  })();
})();
</script>
</body>
</html>
