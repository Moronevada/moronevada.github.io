<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password</title>
  <style>
    body{font-family:system-ui;margin:24px;max-width:560px}
    .hidden{display:none}
    .muted{opacity:.8}
    input,button{font:inherit;padding:8px 10px}
    label{display:block;margin:12px 0 6px}
  </style>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // TODO: pon tus valores reales:
    const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { flowType: 'pkce', autoRefreshToken: false, persistSession: true }
    });

    const $ = (id) => document.getElementById(id);
    const log = (...a) => { console.log('[reset]', ...a); };

    // Extrae parámetros (soporta query y hash)
    function getParams(){
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      return {
        // PKCE correcto:
        code: q.get('code') || h.get('code'),
        // Edge-case hash tokens:
        access_token: q.get('access_token') || h.get('access_token'),
        refresh_token: q.get('refresh_token') || h.get('refresh_token'),
        type: (q.get('type') || h.get('type') || '').toLowerCase(),
        email: q.get('email') || h.get('email')
      };
    }

    async function tryExchange(){
      const p = getParams();
      log('params:', p);

      // Camino ideal: viene un ?code=
      if (p.code) {
        $('status').textContent = 'Preparando sesión segura…';
        const { data, error } = await supabase.auth.exchangeCodeForSession(p.code);
        if (error) throw error;
        if (!data?.session) throw new Error('No se creó la sesión');
        log('session (pkce) ok');
        return true;
      }

      // Edge-case: llegó con #access_token
      if (p.access_token && p.refresh_token) {
        $('status').textContent = 'Activando sesión temporal…';
        const { data, error } = await supabase.auth.setSession({
          access_token: p.access_token, refresh_token: p.refresh_token
        });
        if (error) throw error;
        if (!data?.session) throw new Error('No se creó la sesión (hash)');
        log('session (hash) ok');
        return true;
      }

      // Si no hay nada utilizable:
      return false;
    }

    async function main(){
      try {
        const ok = await tryExchange();
        if (!ok) {
          $('status').textContent = 'Enlace incompleto. Vuelve a pedir el email de recuperación.';
          $('debug').classList.remove('hidden');
          $('debug').textContent =
            'Faltan parámetros de sesión. Asegúrate de que Supabase redirige a /reset-password.html y que la URL está en la allow list.';
          return;
        }
        $('status').textContent = '';
        $('form').classList.remove('hidden');
      } catch (e) {
        console.error(e);
        $('status').textContent = 'Tu enlace expiró o no es válido. Pide uno nuevo desde la app.';
      }
    }

    window.addEventListener('DOMContentLoaded', main);

    window.onSubmit = async (ev) => {
      ev.preventDefault();
      const p1 = $('p1').value.trim();
      const p2 = $('p2').value.trim();
      if (p1.length < 8) return alert('Usa al menos 8 caracteres.');
      if (p1 !== p2) return alert('Las contraseñas no coinciden.');

      try {
        $('btn').disabled = true;
        $('btn').textContent = 'Actualizando…';

        const { error } = await supabase.auth.updateUser({ password: p1 });
        if (error) throw error;

        await supabase.auth.signOut(); // por seguridad
        location.href = 'easycare://auth-success?type=recovery_done';
      } catch (e) {
        console.error(e);
        alert(e.message || 'Error actualizando contraseña.');
      } finally {
        $('btn').disabled = false;
        $('btn').textContent = 'Actualizar contraseña';
      }
    };
  </script>
</head>
<body>
  <h1>Reset your password</h1>
  <p id="status" class="muted"></p>

  <form id="form" class="hidden" onsubmit="onSubmit(event)">
    <label>Nueva contraseña</label>
    <input id="p1" type="password" required minlength="8" autocomplete="new-password">

    <label>Confirmar contraseña</label>
    <input id="p2" type="password" required minlength="8" autocomplete="new-password" />

    <div style="margin-top:14px">
      <button id="btn" type="submit">Actualizar contraseña</button>
    </div>
  </form>

  <pre id="debug" class="hidden" style="margin-top:16px;background:#f3f3f3;padding:8px"></pre>
</body>
</html>
