<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reset your password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Evitar cache -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; }
    h1 { font-size: 26px; color: #0A355A; margin: 0 0 10px; }
    p { margin: 0 0 12px; }
    .card { max-width: 520px; margin: 0 auto; padding: 18px; border-radius: 12px; background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,.08);}
    .row { margin: 10px 0; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d1d5db; }
    button, a.btn {
      display: inline-block; border: 0; padding: 10px 16px; border-radius: 10px; background: #0A355A; color: #fff; font-weight: 600;
      text-decoration: none;
    }
    button[disabled] { opacity: .6; }
    .muted { color: #6b7280; font-size: 14px; }
    .error { color: #b91c1c; }
    .success { color: #065f46; }
    .hidden { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0f13; color: #d7dbe0; }
      .card { background: #11161c; }
      input { background: #0f141a; color: #e5e7eb; border-color: #253042; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p id="desc" class="muted">We’re validating your request…</p>

    <!-- Paso 1: pedir email si no vino en URL -->
    <div id="ask-email" class="row hidden">
      <label class="muted">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      <div class="row">
        <button id="btn-continue">Continue</button>
      </div>
      <p class="muted">We need your email to validate the reset token.</p>
    </div>

    <!-- Paso 2: formulario nueva contraseña -->
    <form id="form" class="hidden" autocomplete="new-password">
      <div class="row">
        <label class="muted">New password</label>
        <input id="p1" type="password" minlength="8" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <div class="row">
        <label class="muted">Confirm password</label>
        <input id="p2" type="password" minlength="8" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <div class="row">
        <button id="btn-save" type="submit">Save new password</button>
      </div>
    </form>

    <!-- Resultado -->
    <div id="done" class="hidden">
      <p class="success">✅ Your password was updated.</p>
      <div class="row">
        <a id="open-app" class="btn" href="#">Open the app</a>
        <a class="btn" style="background:#e5e7eb;color:#111;margin-left:8px" href="https://moronevada.github.io/">Go to EasyCare site</a>
      </div>
    </div>

    <p id="msg" class="row error hidden"></p>
  </div>

  <script>
    // ====== CONFIGURA TUS CREDENCIALES AQUI ======
    const SUPABASE_URL = "https://TU-PROJECT-REF.supabase.co";    // <-- RELLENAR
    const SUPABASE_ANON_KEY = "ey...";                             // <-- RELLENAR
    // =============================================

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Une ?query + #hash
    function allParams() {
      const p = new URLSearchParams(location.search);
      const h = location.hash ? new URLSearchParams(location.hash.replace(/^#/, "")) : null;
      if (h) for (const [k, v] of h.entries()) if (!p.has(k)) p.set(k, v);
      return p;
    }

    function show(id) { document.getElementById(id).classList.remove("hidden"); }
    function hide(id) { document.getElementById(id).classList.add("hidden"); }
    function setText(id, t) { document.getElementById(id).textContent = t; }
    function setErr(msg) { const el = document.getElementById("msg"); el.textContent = msg; el.classList.remove("hidden"); }
    function clearErr() { document.getElementById("msg").classList.add("hidden"); }

    async function verifyOrSetSession(params, emailFromInput) {
      const type = (params.get("type") || params.get("event") || "").toLowerCase();
      let email = params.get("email") || params.get("email_address") || params.get("user_email") || emailFromInput || "";
      // Soporta OTP (token/token_hash) y access_token+refresh_token
      const token = params.get("token") || params.get("token_hash") || params.get("otp");
      const at = params.get("access_token");
      const rt = params.get("refresh_token");

      // Caso 1: ya vienen access_token y refresh_token → setSession directo
      if (at && rt) {
        return client.auth.setSession({ access_token: at, refresh_token: rt });
      }

      // Caso 2: OTP recovery → verifyOtp requiere email
      if (type === "recovery" && token) {
        if (!email) throw new Error("We need the email to verify the reset link.");
        return client.auth.verifyOtp({ type: "recovery", token, email });
      }

      throw new Error("Invalid or expired recovery link.");
    }

    (async function main() {
      const params = allParams();
      const emailParam = params.get("email") || params.get("email_address") || params.get("user_email") || "";

      // Si no hay email en la URL y el link es de recovery, pídeselo al usuario
      const isRecovery = ((params.get("type") || params.get("event") || "").toLowerCase() === "recovery");
      if (isRecovery && !emailParam && !params.get("access_token")) {
        setText("desc", "Enter your email to continue.");
        show("ask-email");
        document.getElementById("btn-continue").onclick = async () => {
          clearErr();
          const email = (document.getElementById("email").value || "").trim();
          if (!email) return setErr("Enter your email.");
          try {
            setText("desc", "Validating token…");
            hide("ask-email");
            await verifyOrSetSession(params, email);
            setText("desc", "Enter a new password.");
            show("form");
          } catch (e) {
            setErr(e.message || "Invalid or expired link.");
            show("ask-email");
          }
        };
        return;
      }

      // Si tenemos suficiente info, validamos de una
      try {
        await verifyOrSetSession(params, emailParam);
        setText("desc", "Enter a new password.");
        show("form");
      } catch (e) {
        setErr(e.message || "Invalid or expired link.");
      }

      // Submit nueva contraseña
      document.getElementById("form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        clearErr();
        const p1 = document.getElementById("p1").value;
        const p2 = document.getElementById("p2").value;
        if (!p1 || p1.length < 8) return setErr("Minimum 8 characters.");
        if (p1 !== p2) return setErr("Passwords do not match.");

        try {
          document.getElementById("btn-save").disabled = true;
          const { error } = await client.auth.updateUser({ password: p1 });
          if (error) throw error;

          // OK → mostrar botón para volver a la app
          hide("form");
          setText("desc", "Your password was updated.");
          // Deep link a la app con mensaje de éxito
          const backUrl = "easycare://auth-success?type=recovery_done&verified=1";
          const a = document.getElementById("open-app");
          a.setAttribute("href", backUrl);
          show("done");
          // intenta abrir app automáticamente
          try { location.replace(backUrl); } catch (_) { location.href = backUrl; }
        } catch (e) {
          setErr(e.message || "Could not update password.");
        } finally {
          document.getElementById("btn-save").disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
