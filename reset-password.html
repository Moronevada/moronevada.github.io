<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EasyCare – Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;margin:0;padding:32px}
    .card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:24px}
    h1{font-size:20px;margin:0 0 12px}
    p{margin:8px 0 14px;color:#333}
    .muted{color:#667085;font-size:14px}
    input[type=password]{width:100%;padding:12px 14px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}
    button{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:#2f76ff;color:#fff;font-weight:600;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .success{color:#05603A;background:#ECFDF3;border:1px solid #ABEFC6;padding:10px;border-radius:10px;margin:10px 0}
    .error{color:#7A271A;background:#FEF3F2;border:1px solid #FCA5A5;padding:10px;border-radius:10px;margin:10px 0}
    .hidden{display:none}
    pre.debug{white-space:pre-wrap;font-size:12px;color:#666;background:#f9fafb;border:1px solid #eee;border-radius:8px;padding:8px;margin:12px auto;max-width:520px}
    .center{text-align:center}
    a.btn{display:inline-block;margin-top:10px;padding:10px 14px;background:#0f766e;color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="muted">Verifying your link…</p>

    <pre class="debug" id="debug"></pre>

    <div id="msg" class="muted"></div>

    <form id="form" class="hidden">
      <p>Enter your new password:</p>
      <input id="pwd1" type="password" placeholder="New password" minlength="8" required />
      <input id="pwd2" type="password" placeholder="Confirm password" minlength="8" required style="margin-top:10px" />
      <button id="btn" type="submit">Update password</button>
    </form>

    <div id="done" class="hidden">
      <div class="success">Password updated successfully.</div>
      <p class="muted">You can go back to the app.</p>
      <div class="center">
        <a id="deeplink" class="btn" href="#">Return to EasyCare</a>
      </div>
    </div>
  </div>

<script>
(function(){
  const SUPABASE_URL = 'https://tcobgzhtmuxzjdkmwdsy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjb2Jnemh0bXV4empka213ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3OTI2NjYsImV4cCI6MjA2NDM2ODY2Nn0.OmLd2uGnPenJeZO323XRXJK-d-8RPfl-GBEK8MoY1i0';

  const APP_SCHEME = 'easycare://auth-success?type=recovery_done';
  const ANDROID_INTENT = 'intent://auth-success?type=recovery_done#Intent;scheme=easycare;package=easycare.com.easycare_app;end';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const debugEl = document.getElementById('debug');
  const log = (...a)=>{ try{console.log(...a)}catch(_){};
    debugEl.textContent += a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')+'\n';
  };

  const msg = document.getElementById('msg');
  const form = document.getElementById('form');
  const done = document.getElementById('done');
  const btn  = document.getElementById('btn');
  const deeplink = document.getElementById('deeplink');

  function parseFragment(fragment) {
    const out = {};
    fragment.replace(/^#/, '').split('&').forEach(kv=>{
      if(!kv) return;
      const [k,v] = kv.split('=');
      out[decodeURIComponent(k)] = decodeURIComponent(v||'');
    });
    return out;
  }

  // Deep link setup
  (function(){
    const isAndroid = /Android/i.test(navigator.userAgent);
    deeplink.href = isAndroid ? ANDROID_INTENT : APP_SCHEME;
    deeplink.addEventListener('click', ()=>{
      try{ window.location.href = isAndroid ? ANDROID_INTENT : APP_SCHEME; }catch(_){}
    }, { once:true });
  })();

  async function showFormAfterSession(){
    msg.className='muted';
    msg.textContent = 'Link verified. Please set a new password.';
    form.classList.remove('hidden');

    form.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const p1 = document.getElementById('pwd1').value.trim();
      const p2 = document.getElementById('pwd2').value.trim();
      if (p1.length < 8) { msg.className='error'; msg.textContent='Use at least 8 characters.'; return; }
      if (p1 !== p2)     { msg.className='error'; msg.textContent='Passwords do not match.';   return; }
      btn.disabled = true; msg.className='muted'; msg.textContent='Updating password…';

      try {
        const { error } = await sb.auth.updateUser({ password: p1 });
        if (error) throw error;
        form.classList.add('hidden');
        done.classList.remove('hidden');
        setTimeout(()=>{
          try{
            const isAndroid = /Android/i.test(navigator.userAgent);
            window.location.href = isAndroid ? ANDROID_INTENT : APP_SCHEME;
          }catch(_){}
        }, 1500);
      } catch (e) {
        btn.disabled = false;
        msg.className='error';
        msg.textContent = 'Could not update password: ' + (e?.message || e);
        log('updateUser FAIL:', e?.message || e);
      }
    }, { once:true });
  }

  (async function bootstrap(){
    try {
      const url = new URL(window.location.href);
      const code       = url.searchParams.get('code');
      const codeVer    = url.searchParams.get('code_verifier'); // <-- NUEVO: solo usamos code si viene con verifier
      const token      = url.searchParams.get('token');
      const tokenHash  = url.searchParams.get('token_hash') || token;
      const type       = (url.searchParams.get('type')||'').toLowerCase();

      const frag       = parseFragment(url.hash);
      const accessToken  = frag.access_token || url.searchParams.get('access_token');
      const refreshToken = frag.refresh_token || url.searchParams.get('refresh_token');
      const fragType     = (frag.type||'').toLowerCase();

      log('href:', window.location.href);
      log('type:', type, 'fragType:', fragType);
      log('token_hash present:', !!tokenHash, 'code present:', !!code, 'code_verifier present:', !!codeVer);
      log('has access/refresh:', !!accessToken, !!refreshToken);

      // 1) Fragmento moderno (#access_token & #refresh_token)
      if ((type === 'recovery' || fragType === 'recovery') && accessToken && refreshToken) {
        const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        if (error) throw error;
        log('setSession OK (fragment)');
        await showFormAfterSession();
        return;
      }

      // 2) token_hash legado (verifyOtp) — priorizado
      if ((type === 'recovery') && tokenHash) {
        let ok = false, lastErr = null;

        try{
          const { error } = await sb.auth.verifyOtp({ type:'recovery', token_hash: tokenHash });
          if (error) throw error;
          ok = true; log('verifyOtp recovery (token_hash) OK');
        }catch(e){ lastErr = e; log('verifyOtp recovery (token_hash) FAIL:', e?.message || e); }

        if (!ok) {
          try{
            const { error } = await sb.auth.verifyOtp({ type:'recovery', tokenHash: tokenHash });
            if (error) throw error;
            ok = true; log('verifyOtp recovery (tokenHash) OK');
          }catch(e){ lastErr = e; log('verifyOtp recovery (tokenHash) FAIL:', e?.message || e); }
        }

        if (!ok) throw lastErr || new Error('Recovery link could not be verified.');
        const { data, error: e2 } = await sb.auth.getSession();
        if (e2 || !data.session) throw e2 || new Error('No session after verifyOtp');

        await showFormAfterSession();
        return;
      }

      // 3) PKCE code → SOLO si trae code_verifier (evitamos el error)
      if (code && codeVer) {
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) { log('exchangeCodeForSession FAIL:', error.message||error); throw error; }
        log('exchangeCodeForSession OK');
        await showFormAfterSession();
        return;
      } else if (code && !codeVer) {
        log('Ignoring bare code without code_verifier');
      }

      // Nada reconocido
      msg.className = 'error';
      msg.textContent = 'Invalid or expired link. Please request a new password reset.';
    } catch (e) {
      msg.className = 'error';
      msg.textContent = 'Verification failed: ' + (e?.message || e);
      log('FINAL ERROR:', e?.message || e);
    }
  })();
})();
</script>
</body>
</html>
