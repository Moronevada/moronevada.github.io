<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EasyCare – Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;margin:0;padding:32px}
    .card{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.06);padding:24px}
    h1{font-size:20px;margin:0 0 12px}
    p{margin:8px 0 14px;color:#333}
    .muted{color:#667085;font-size:14px}
    input[type=password]{width:100%;padding:12px 14px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}
    button{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:#2f76ff;color:#fff;font-weight:600;cursor:pointer}
    .success{color:#05603A;background:#ECFDF3;border:1px solid #ABEFC6;padding:10px;border-radius:10px;margin:10px 0}
    .error{color:#7A271A;background:#FEF3F2;border:1px solid #FCA5A5;padding:10px;border-radius:10px;margin:10px 0}
    .hidden{display:none}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="muted">Verifying your link…</p>
    <div id="msg" class="muted"></div>

    <form id="form" class="hidden">
      <p>Enter your new password:</p>
      <input id="pwd" type="password" placeholder="New password" minlength="8" required />
      <button type="submit">Update password</button>
    </form>

    <div id="done" class="hidden">
      <div class="success">Password updated successfully.</div>
      <p class="muted">You can go back to the app.</p>
      <!-- Profundamente integrado con tu app (plan acordado): -->
      <a id="deeplink" href="easycare://auth-success?type=recovery_done">
        <button>Return to EasyCare</button>
      </a>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://tcobgzhtmuxzjdkmwdsy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjb2Jnemh0bXV4empka213ZHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg3OTI2NjYsImV4cCI6MjA2NDM2ODY2Nn0.OmLd2uGnPenJeZO323XRXJK-d-8RPfl-GBEK8MoY1i0';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const msg = document.getElementById('msg');
const form = document.getElementById('form');
const done = document.getElementById('done');

function parseFragment(fragment) {
  // #access_token=...&refresh_token=...&type=recovery
  const out = {};
  fragment.replace(/^#/, '').split('&').forEach(kv=>{
    const [k,v] = kv.split('=');
    if(k) out[decodeURIComponent(k)] = decodeURIComponent(v||'');
  });
  return out;
}

(async function bootstrap(){
  try {
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    const tokenHash = url.searchParams.get('token_hash');
    const type = url.searchParams.get('type');
    const frag = parseFragment(url.hash);
    const accessToken = frag.access_token;
    const refreshToken = frag.refresh_token;
    const fragType = frag.type;

    // 1) Nuevo formato: ?code=...
    if (code) {
      const { data, error } = await sb.auth.exchangeCodeForSession(code);
      if (error) throw error;
      msg.textContent = 'Link verified. Please set a new password.';
      form.classList.remove('hidden');
      return;
    }

    // 2) Fragmento: #access_token=...&refresh_token=...&type=recovery
    if (accessToken && refreshToken && (fragType === 'recovery' || !type)) {
      const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      if (error) throw error;
      msg.textContent = 'Link verified. Please set a new password.';
      form.classList.remove('hidden');
      return;
    }

    // 3) token_hash + type=recovery (ruta verifyOtp)
    if (tokenHash && (type === 'recovery')) {
      const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
      if (error) throw error;
      msg.textContent = 'Link verified. Please set a new password.';
      form.classList.remove('hidden');
      return;
    }

    // Si no hubo nada reconocible:
    msg.className = 'error';
    msg.textContent = 'Invalid or expired link. Please request a new password reset.';
  } catch (e) {
    msg.className = 'error';
    msg.textContent = 'Verification failed: ' + (e?.message || e);
  }
})();

form.addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const pwd = document.getElementById('pwd').value;
  msg.textContent = 'Updating password…';
  try {
    const { data: user, error } = await sb.auth.updateUser({ password: pwd });
    if (error) throw error;
    msg.textContent = '';
    form.classList.add('hidden');
    done.classList.remove('hidden');

    // (Opcional) Redirigir automático al deep link tras 1.5s:
    setTimeout(()=>{ window.location.href = 'easycare://auth-success?type=recovery_done'; }, 1500);
  } catch (e) {
    msg.className = 'error';
    msg.textContent = 'Could not update password: ' + (e?.message || e);
  }
});
</script>
</body>
</html>
